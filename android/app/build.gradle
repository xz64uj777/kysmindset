plugins {
    id "com.android.application"
}

def ksProps = new Properties()
def ksFile = rootProject.file("keystore.properties")
if (!ksFile.exists()) {
    throw new GradleException("Missing android/keystore.properties — needed to sign every APK with the same key.")
}
ksFile.withInputStream { ksProps.load(it) }
def ksStore = rootProject.file(ksProps["storeFile"] ?: "kysmindset-upload.jks")
if (!ksStore.exists()) {
    throw new GradleException("Missing signing keystore: ${ksStore}")
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "org.jetbrains.kotlin") {
            details.useVersion "1.9.24"
            details.because "align kotlin-stdlib / jdk7 / jdk8 for biometric"
        }
    }
}

android {
    namespace "app.kysmindset.security"
    compileSdk 35
    defaultConfig {
        applicationId "app.kysmindset.sec2"
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName "2.2.0"
    }
    signingConfigs {
        upload {
            storeFile ksStore
            storePassword ksProps["storePassword"]
            keyAlias ksProps["keyAlias"]
            keyPassword ksProps["keyPassword"]
            enableV1Signing true
            enableV2Signing true
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.upload
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.upload
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "Kysmindset-2.apk"
        }
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "androidx.core:core:1.15.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.security:security-crypto:1.0.0"
}
