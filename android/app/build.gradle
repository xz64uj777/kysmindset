plugins {
    id "com.android.application"
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "org.jetbrains.kotlin") {
            details.useVersion "1.9.24"
            details.because "align kotlin-stdlib / jdk7 / jdk8 for biometric"
        }
    }
}

android {
    namespace "app.kysmindset.security"
    compileSdk 35
    defaultConfig {
        applicationId "app.kysmindset.sec2"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "2.1.0"
    }
    signingConfigs {
        kys {
            storeFile rootProject.file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.kys
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.kys
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "Kysmindset-2.apk"
        }
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "androidx.core:core:1.15.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.biometric:biometric:1.1.0"
}
