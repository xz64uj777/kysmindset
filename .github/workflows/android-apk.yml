name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci || npm install
      - run: npm run build

      - name: Copy web build into Android assets
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -a dist/. android/app/src/main/assets/www/

      - name: Stamp rising versionCode
        run: |
          VC=${{ github.run_number }}
          sed -i "s/versionCode [0-9]*/versionCode ${VC}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"2.1.${VC}\"/" android/app/build.gradle
          grep version android/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: kysmindset-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Kysmindset APK 2.1
          body: |
            **2.1** (versionCode ${{ github.run_number }})

            Lock phone now: Android lock first, then this app’s PIN (even if you were in the app).
            Pin while locked still uses Android’s pin. This build does **not** sit on the system lock screen.

            After a scan, Overview keeps a Found panel (hosts + assessment) — the live feed is not the only result.

            PIN 1234 (app PIN, not phone PIN).
            Debug APK — Play Protect may warn.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
