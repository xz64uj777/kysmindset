name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci || npm install
      - run: npm run build

      - name: Copy web build into Android assets
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -a dist/. android/app/src/main/assets/www/

      - name: Stamp rising versionCode
        run: |
          VC=${{ github.run_number }}
          sed -i "s/versionCode [0-9]*/versionCode ${VC}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"2.2.${VC}\"/" android/app/build.gradle
          grep version android/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Verify signed APK
        run: |
          APK=android/app/build/outputs/apk/debug/Kysmindset-2.apk
          test -f "$APK"
          python3 - <<PY
          p="$APK"
          data=open(p,"rb").read()
          assert b"APK Sig Block 42" in data, "missing v2 signature"
          print("signed", len(data), "bytes")
          PY
          cp "$APK" android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kysmindset-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Kysmindset 2 APK
          body: |
            **Kysmindset 2** (versionCode: ${{ github.run_number }})

            Its own app. Original Kysmindset can stay installed next to it.

            Signed with the stable sideload key. Later APKs install over this one.
            In-app Update checks that the APK is the same app and the same key.

            PIN 1234. Play Protect may warn — Install anyway.

            Lock phone now: Android lock first, then this app’s PIN.
            Start Protection comes back after reboot if Auto Restart is on.
          files: |
            android/app/build/outputs/apk/debug/Kysmindset-2.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
